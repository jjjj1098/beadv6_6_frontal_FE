<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — Biddy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="../index.html">bid<span style="color:var(--accent)">dy</span></a>
    <div class="nav-links">
      <span class="text-muted">계정이 없으신가요?</span>
      <a href="signup.html">회원가입</a>
    </div>
  </nav>

  <div class="container">
    <div class="card mt-3">
      <div class="card-title">로그인</div>
      <div class="card-subtitle">Biddy 계정으로 로그인하세요</div>

      <div class="alert" id="alert"></div>

      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="example@email.com">
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력">
      </div>

      <button class="btn btn-primary mt-2" id="submitBtn" onclick="handleLogin()">
        로그인
      </button>

      <div class="divider">또는</div>

      <div class="text-center text-muted">
        계정이 없으신가요? <a href="signup.html">회원가입</a>
      </div>
    </div>
  </div>

  <script src="../js/member.js"></script>
  <script>
    redirectIfLoggedIn();

    async function handleLogin() {
      const alertEl = document.getElementById('alert');
      const btn = document.getElementById('submitBtn');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        return showAlert(alertEl, '이메일과 비밀번호를 입력해주세요.');
      }

      hideAlert(alertEl);
      setLoading(btn, true);

      try {
        await login({ email, password });
        location.href = 'mypage.html';
      } catch (err) {
        showAlert(alertEl, err.message || '이메일 또는 비밀번호가 올바르지 않습니다.');
      } finally {
        setLoading(btn, false);
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
