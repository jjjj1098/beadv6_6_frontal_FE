<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 — Biddy</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-badge { display: inline-block; padding: 0.2rem 0.6rem; background: rgba(255, 80, 80, 0.15); color: #ff5050; border: 1px solid rgba(255, 80, 80, 0.3); border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    .tab-btn { padding: 0.5rem 1rem; background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
    .tab-btn.active { background: var(--accent); color: white; }
    .list-container { display: flex; flex-direction: column; gap: 0.75rem; }
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: var(--surface2); border-radius: 8px; }
    .item-info { display: flex; flex-direction: column; gap: 0.25rem; }
    .item-title { font-weight: 600; font-size: 0.95rem; }
    .item-sub { font-size: 0.8rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="../index.html">bid<span style="color:var(--accent)">dy</span></a>
    <div class="nav-links">
      <span class="admin-badge">ADMIN</span>
      <button class="btn btn-secondary" onclick="logout()">로그아웃</button>
    </div>
  </nav>

  <div class="container wide">
    <div class="admin-tabs mt-3">
      <button class="tab-btn active" onclick="switchTab('withdrawals')">탈퇴 관리</button>
      <button class="tab-btn" onclick="switchTab('members')">회원 관리</button>
      <button class="tab-btn" onclick="switchTab('settlements')">정산 관리</button>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <div>
          <div class="card-title" id="panelTitle">탈퇴 요청 목록</div>
          <div class="card-subtitle" id="panelSubtitle">회원 관련 요청을 처리합니다.</div>
        </div>
        <button class="btn btn-secondary" onclick="refreshCurrentTab()">새로고침</button>
      </div>
      <div class="alert" id="alert"></div>
      <div id="loading" class="text-muted">불러오는 중...</div>
      <div id="contentList" class="list-container" style="display:none;"></div>
    </div>
  </div>

  <script src="../js/member.js"></script>
  <script src="../js/payment.js"></script> 
<script>
  redirectIfNotLoggedIn();
  let currentTab = 'withdrawals';

  // [1] 회원 목록 로드 (예치금 포함)
  async function loadMembers() {
  showLoading();
  try {
    // 1. 회원 목록 조회
    const members = await apiCall('GET', '/admin/members', null, true);
    console.log("서버에서 받은 회원 데이터:", members);

    // 2. 각 회원별로 잔액을 비동기로 조회하여 데이터 병합
    const membersWithBalance = await Promise.all(members.map(async (user) => {
      try {
        // 잔액 API 호출 (반환값이 { balance: 1000 } 형태라고 가정)
        const balanceRes = await paymentApi.getBalance(user.id);
        
        // 서버 응답 구조가 { data: { balance: 1000 } } 이라면 balanceRes.data.balance 사용
        const balance = balanceRes?.balance ?? balanceRes?.data?.balance ?? 0;
        
        return { ...user, balance: balance };
      } catch (e) {
        console.error(`회원 ${user.id} 잔액 조회 실패`, e);
        return { ...user, balance: 0 };
      }
    }));

    // 3. 병합된 데이터로 렌더링
    renderList(membersWithBalance, user => `
      <div class="admin-item">
        <div class="item-info">
          <div class="item-title">${user.nickname} (${user.email})</div>
          <div class="item-sub">권한: ${user.role} | 상태: ${user.status} | 
            <strong>예치금: ${formatMoney(user.balance || 0)}원</strong>
          </div>
        </div>
        <div class="item-actions">
          <button class="btn btn-secondary" onclick="promptBalanceChange(${user.id}, '${user.nickname}')">예치금 수정</button>
          <button class="btn btn-danger" onclick="executeAction('POST', '/admin/members/${user.id}/ban', '${user.nickname}님을 추방했습니다.', loadMembers)">추방</button>
        </div>
      </div>
    `);
    
    document.getElementById('loading').style.display = 'none'; // 로딩바 숨기기
  } catch (err) {
    console.error(err);
    document.getElementById('loading').textContent = '회원 목록 로드 실패';
  }
}

  // [2] 예치금 강제 수정 (paymentApi 사용)
  async function promptBalanceChange(userId, nickname) {
    const amount = prompt(`${nickname} 회원의 변경할 예치금액을 입력하세요:`);
    if (amount === null || isNaN(amount)) return;

    const reason = prompt("변경 사유를 입력하세요:");
    if (!reason) {
        alert("사유는 반드시 입력해야 합니다.");
        return;
    }

    try {
      // 서버가 요구하는 필수 필드 3가지를 모두 포함합니다.
      // (userId, amount, reason)
      const requestData = { 
        userId: userId,    // 서버가 userId를 필수라고 하니 추가했습니다.
        memberId: userId,  // 혹시 모르니 이전 에러를 피하기 위해 둘 다 포함합니다.
        amount: Number(amount),
        reason: reason
      };

      await paymentApi.adjust(requestData);
      
      showAlert(document.getElementById('alert'), `${nickname}님의 예치금이 조정되었습니다.`, 'success');
      loadMembers();
    } catch (err) {
      showAlert(document.getElementById('alert'), '수정 실패: ' + err.message);
    }
  }

  // [3] 탭 전환
  async function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    const titleEl = document.getElementById('panelTitle');
    const subEl = document.getElementById('panelSubtitle');

    if (tabName === 'withdrawals') {
      titleEl.textContent = '탈퇴 요청 목록';
      subEl.textContent = '승인 시 회원 데이터가 삭제됩니다.';
      loadWithdrawals();
    } else if (tabName === 'members') {
      titleEl.textContent = '전체 회원 관리';
      subEl.textContent = '회원을 강제 추방하거나 예치금을 수정할 수 있습니다.';
      loadMembers();
    } else if (tabName === 'settlements') {
      titleEl.textContent = '월별 정산 관리';
      subEl.textContent = '정산 배치를 실행하거나 현황을 확인합니다.';
      loadSettlements();
    }
  }

  // [4] 기타 헬퍼 함수들
  function refreshCurrentTab() {
    if (currentTab === 'withdrawals') loadWithdrawals();
    else if (currentTab === 'members') loadMembers();
    else if (currentTab === 'settlements') loadSettlements();
  }

  async function loadWithdrawals() {
    showLoading();
    try {
      const data = await apiCall('GET', '/admin/withdrawals', null, true);
      renderList(data, item => `
        <div class="admin-item">
          <div class="item-info">
            <div class="item-title">회원 ID: ${item.memberId}</div>
            <div class="item-sub">요청일: ${new Date(item.requestedAt).toLocaleString()}</div>
          </div>
          <button class="btn btn-danger" onclick="executeAction('POST', '/admin/withdrawals/${item.memberId}/approve', '승인 완료', loadWithdrawals)">승인</button>
        </div>
      `);
    } catch { document.getElementById('loading').textContent = '로드 실패'; }
  }

  async function loadSettlements() {
    showLoading();
    try {
      const data = await apiCall('GET', '/payments/settlements', null, true);
      const listEl = document.getElementById('contentList');
      listEl.innerHTML = `
        <button class="btn btn-primary" onclick="executeAction('POST', '/payments/settlements/monthly', '정산 완료', loadSettlements, {year:2026, month:6})">이번 달 정산 배포 실행</button>
        ${data.data.map(s => `
          <div class="admin-item">
            <div>회원: ${s.userId} | 금액: ${formatMoney(s.amount)}</div>
            <div>상태: ${s.status}</div>
          </div>
        `).join('')}
      `;
      hideLoading();
    } catch { document.getElementById('loading').textContent = '데이터 로드 실패'; }
  }

  async function executeAction(method, url, msg, callback, body = {}) {
    if (!confirm('진행하시겠습니까?')) return;
    try {
      await apiCall(method, url, body, true);
      showAlert(document.getElementById('alert'), msg, 'success');
      callback();
    } catch (err) { showAlert(document.getElementById('alert'), err.message); }
  }

  function showLoading() { document.getElementById('loading').style.display = 'block'; document.getElementById('contentList').style.display = 'none'; }
  function hideLoading() { document.getElementById('loading').style.display = 'none'; document.getElementById('contentList').style.display = 'flex'; }
  function renderList(data, templateFn) {
      hideLoading();
      document.getElementById('contentList').innerHTML = data.length ? data.map(templateFn).join('') : '<div class="empty-state">데이터가 없습니다.</div>';
  }

  // 초기화
  loadWithdrawals();
</script>
</body>
</html>
