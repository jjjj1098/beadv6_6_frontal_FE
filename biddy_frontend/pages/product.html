<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 목록 - Biddy</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="nav">
    <a href="/index.html" class="nav-logo">bid<span>dy</span></a>
    <div class="nav-links">
      <a href="/pages/product.html">상품목록</a>
      <a href="/pages/cart.html">장바구니</a>
      <a href="/pages/wallet.html">지갑</a>
    </div>
  </nav>

  <main style="padding: 2rem;">
    <h2>상품 관리</h2>
    
    <div style="margin-bottom: 20px;">
      <button onclick="loadProducts()">전체</button>
      <button onclick="loadProducts('AUCTION')">경매상품</button>
      <button onclick="loadProducts('FIXED_PRICE')">일반상품</button>
      <button class="btn btn-primary" onclick="showCreateForm()">상품 등록</button>
    </div>

    <div id="createForm" style="display:none; border:1px solid #ddd; padding:20px; margin-bottom:20px; border-radius:8px;">
      <h3>상품 등록</h3>
      <input type="text" id="title" placeholder="상품명" style="margin-bottom:10px;"><br>
      <input type="number" id="price" placeholder="가격" style="margin-bottom:10px;"><br>
      <select id="saleType" style="margin-bottom:10px;">
        <option value="AUCTION">경매</option>
        <option value="FIXED_PRICE">일반판매</option>
      </select><br>
      <button onclick="submitProduct()">등록하기</button>
      <button onclick="hideCreateForm()">취소</button>
    </div>

    <div id="productList"></div>
  </main>

  <script src="../js/product.js"></script> <script src="../js/member.js"></script> <script>
    // 상품 목록 불러오기
    async function loadProducts(saleType = null) {
      try {
        const products = await productApi.getList(saleType);
        const container = document.getElementById('productList');
        
        container.innerHTML = products.map(p => `
          <div class="product-item" style="border:1px solid #eee; padding:10px; margin-bottom:10px;">
            <h3>${p.title}</h3>
            <p>가격: ${p.price.toLocaleString()}원 | 타입: ${p.saleType}</p>
          </div>
        `).join('');
      } catch (err) {
        alert("상품 목록을 불러올 수 없습니다.");
      }
    }

    // 폼 제어
    function showCreateForm() { document.getElementById('createForm').style.display = 'block'; }
    function hideCreateForm() { document.getElementById('createForm').style.display = 'none'; }

    // 상품 등록
    async function submitProduct() {
      const data = {
        title: document.getElementById('title').value,
        price: Number(document.getElementById('price').value),
        saleType: document.getElementById('saleType').value
      };

      try {
        await productApi.create(data);
        alert('등록 성공!');
        hideCreateForm();
        loadProducts(); // 새로고침
      } catch (err) {
        alert('등록 실패: ' + (err.message || "알 수 없는 오류"));
      }
    }

    // 페이지 로드 시 전체 목록 표시
    loadProducts();
  </script>
</body>
</html>
